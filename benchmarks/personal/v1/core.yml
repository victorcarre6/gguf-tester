schema_version: 1
name: personal-core
version: "1.0.0"
tasks:
  - id: science-water
    type: generation
    prompt: "Quelle est la formule chimique de l'eau ? Réponds uniquement avec la formule."
    grader: {type: exact, accepted: [H2O]}
    tags: [factuality, science, fr]
  - id: geography-france
    type: generation
    prompt: "Quelle est la capitale de la France ?"
    grader: {type: regex, pattern: "\\bParis\\b"}
    tags: [factuality, geography, fr]
  - id: geography-australia
    type: generation
    prompt: "What is the capital of Australia?"
    grader: {type: regex, pattern: "\\bCanberra\\b"}
    tags: [factuality, geography, en]
  - id: arithmetic-17x19
    type: generation
    prompt: "Calcule 17 × 19. Réponds uniquement par le nombre."
    grader: {type: exact, accepted: ["323"]}
    tags: [reasoning, arithmetic, fr]
  - id: arithmetic-fraction
    type: generation
    prompt: "Simplify 42/56. Answer only with the reduced fraction."
    grader: {type: exact, accepted: [3/4]}
    tags: [reasoning, arithmetic, en]
  - id: logic-sequence
    type: generation
    prompt: "Complete the sequence: 2, 6, 12, 20, 30, __. Answer only with the number."
    grader: {type: exact, accepted: ["42"]}
    tags: [reasoning, en]
  - id: logic-syllogism
    type: generation
    prompt: "Tous les zargs sont bleus. Aucun objet bleu n'est rouge. Un zarg peut-il être rouge ?"
    grader: {type: regex, pattern: "\\b(non|impossible)\\b"}
    tags: [reasoning, logic, fr]
  - id: instruction-uppercase
    type: generation
    prompt: "Write exactly the word benchmark in uppercase, with no punctuation."
    grader: {type: exact, accepted: [BENCHMARK]}
    tags: [instruction, en]
  - id: instruction-three-items
    type: generation
    prompt: "Donne exactement trois nombres séparés par des virgules, sans autre texte."
    grader: {type: regex, pattern: "^\\s*\\d+\\s*,\\s*\\d+\\s*,\\s*\\d+\\s*$"}
    tags: [instruction, structured, fr]
  - id: json-person
    type: generation
    prompt: "Return only JSON for a person named Ada aged 36, with keys name and age."
    grader:
      type: json_schema
      schema: {type: object, required: [name, age]}
    tags: [structured, json, en]
  - id: json-array
    type: generation
    prompt: "Return only a JSON array containing the integers 1, 2 and 3."
    grader:
      type: json_schema
      schema: {type: array}
    tags: [structured, json, en]
  - id: translation-en-fr
    type: generation
    prompt: "Traduis en français : The book is on the table."
    grader: {type: regex, pattern: "livre.*table"}
    tags: [translation, fr, en]
  - id: translation-fr-en
    type: generation
    prompt: "Translate into English: Il pleut depuis ce matin."
    grader: {type: regex, pattern: "rain(ing|ed)?.*(this morning|since)"}
    tags: [translation, fr, en]
  - id: python-list-comprehension
    type: generation
    prompt: "Write one Python expression producing the squares of integers 0 through 4."
    grader: {type: regex, pattern: "\\[.*for.*in.*range\\(5\\).*\\]"}
    tags: [coding, python]
  - id: python-exception
    type: generation
    prompt: "Which Python exception is raised by int('abc')? Answer only with its class name."
    grader: {type: exact, accepted: [ValueError]}
    tags: [coding, python]
  - id: sql-count
    type: generation
    prompt: "Write a SQL query counting every row in a table named users."
    grader: {type: regex, pattern: "SELECT\\s+COUNT\\s*\\(\\s*\\*\\s*\\)\\s+FROM\\s+users"}
    tags: [coding, sql]
  - id: http-not-found
    type: generation
    prompt: "What HTTP status code means Not Found? Answer only with the code."
    grader: {type: exact, accepted: ["404"]}
    tags: [coding, web]
  - id: git-current-branch
    type: generation
    prompt: "Give one Git command that prints the current branch name."
    grader: {type: regex, pattern: "git\\s+(branch\\s+--show-current|rev-parse\\s+--abbrev-ref)"}
    tags: [coding, git]
  - id: shell-exit-code
    type: generation
    prompt: "In POSIX shell, what variable contains the previous command's exit status?"
    grader: {type: regex, pattern: "\\$\\?"}
    tags: [coding, shell]
  - id: security-password
    type: generation
    prompt: "Name a password hashing algorithm designed to resist brute force attacks."
    grader: {type: regex, pattern: "\\b(Argon2|scrypt|bcrypt)\\b"}
    tags: [security]
  - id: uncertainty
    type: generation
    prompt: "What was the exact temperature in Paris at 12:03 UTC on 14 March 1327?"
    grader: {type: regex, pattern: "(unknown|cannot know|not available|impossible|inconnu|impossible à savoir)"}
    tags: [factuality, uncertainty]
  - id: concise-summary
    type: generation
    prompt: "Summarize 'The service started, processed the request, and stopped' in exactly three words."
    grader: {type: regex, pattern: "^\\s*\\S+\\s+\\S+\\s+\\S+[.!]?\\s*$"}
    tags: [instruction, summarization]
  - id: command-python-fix
    type: command
    prompt: "Fix the Python project in the provided workspace so all tests pass."
    workspace: fixtures/python-fix
    grader:
      type: command
      command: [python, -m, pytest, -q, acceptance_tests.py]
    limits: {timeout_seconds: 120}
    tags: [coding, agentic, command]
  - id: judged-explanation
    type: generation
    prompt: "Explain why deterministic seeds do not guarantee identical GPU inference across every backend."
    grader:
      type: llm_judge
      rubric: "The answer should mention nondeterministic kernels or implementation/hardware differences."
    tags: [reasoning, llm-judge]
