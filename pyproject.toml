[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufscan"
version = "0.5.0"
description = "Local GGUF security scanner and personal benchmark runner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Carre" }]
dependencies = [
    "numpy>=1.20.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
inference = ["llama-cpp-python>=0.3.23"]
gpu = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ggufscan = "ggufscan.cli:main"
ggufscan-judge = "ggufscan.ragas_cli:main"
# Historical alias kept during the phase-0 compatibility window.
ggufscan-ragas = "ggufscan.ragas_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ggufscan*"]

[tool.setuptools.package-data]
ggufscan = ["data/*.yaml", "data/prompts/*.yaml"]
